<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prime Security - Consulta EPP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .encabezado {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .encabezado h1 {
            margin: 0;
            font-size: 30px;
        }

        .encabezado p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .contenedor {
            max-width: 600px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .titulo {
            text-align: center;
            color: #111827;
            margin-bottom: 25px;
        }

        .dato {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 13px 0;
        }

        .dato strong {
            color: #374151;
        }

        .valor {
            text-align: right;
        }

        .estado {
            color: green;
            font-weight: bold;
        }

        .codigo {
            text-align: center;
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .pie {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        .error {
            text-align: center;
            color: #b91c1c;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 20px;
                padding: 20px;
            }

            .dato {
                flex-direction: column;
                gap: 5px;
            }

            .valor {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="encabezado">
        <h1>PRIME SECURITY</h1>
        <p>Sistema de consulta de Equipo de Protección Personal</p>
    </div>

    <div class="contenedor">

        <h2 class="titulo">Consulta de EPP</h2>

        <div class="codigo">
            Código: <span id="codigo"></span>
        </div>

        <div id="informacion"></div>

        <div class="pie">
            Prime Security © 2026
        </div>

    </div>

    <script>

        // Base de datos de demostración
        const empresas = {

            "EMP-002": {
                empresa: "Maquiladora Assembly",
                encargado: "Pedro García",
                producto: "Guantes de seguridad I",
                cantidad: "20",
                fechaEntrega: "13/08/2026",
                fechaVencimiento: "13/08/2027",
                estado: "Activo"
            }

        };

        // Obtener el código de la dirección
        const parametros = new URLSearchParams(window.location.search);
        const codigo = parametros.get("codigo");

        const codigoMostrar = document.getElementById("codigo");
        const informacion = document.getElementById("informacion");

        if (codigo && empresas[codigo]) {

            const datos = empresas[codigo];

            codigoMostrar.textContent = codigo;

            informacion.innerHTML = `
                <div class="dato">
                    <strong>Empresa:</strong>
                    <span class="valor">${datos.empresa}</span>
                </div>

                <div class="dato">
                    <strong>Encargado:</strong>
                    <span class="valor">${datos.encargado}</span>
                </div>

                <div class="dato">
                    <strong>Producto:</strong>
                    <span class="valor">${datos.producto}</span>
                </div>

                <div class="dato">
                    <strong>Cantidad:</strong>
                    <span class="valor">${datos.cantidad}</span>
                </div>

                <div class="dato">
                    <strong>Fecha de entrega:</strong>
                    <span class="valor">${datos.fechaEntrega}</span>
                </div>

                <div class="dato">
                    <strong>Fecha de vencimiento:</strong>
                    <span class="valor">${datos.fechaVencimiento}</span>
                </div>

                <div class="dato">
                    <strong>Estado:</strong>
                    <span class="valor estado">${datos.estado}</span>
                </div>
            `;

        } else {

            codigoMostrar.textContent = codigo || "Sin código";

            informacion.innerHTML = `
                <div class="error">
                    No se encontró información para este código.
                </div>
            `;
        }

    </script>

</body>
</html
